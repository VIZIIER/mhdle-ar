<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="A daily Monster Hunter guessing game in Arabic and English: Classic, Compendium, Surveyor and Roar." />
    <meta name="theme-color" content="#14231d" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <title>MH DLE · Monster Hunter guessing game</title>
    <script>
      // Apply the saved language before first paint to avoid a left-to-right flash in Arabic.
      try {
        var l = localStorage.getItem('mhdle:v1:lang');
        if (l === 'ar') { document.documentElement.lang = 'ar'; document.documentElement.dir = 'rtl'; }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>This game needs JavaScript. / تحتاج هذه اللعبة إلى تفعيل جافاسكربت.</noscript>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
